[package]
name        = "aruaru-query"
description = "aruaru-DB query engine: SQL subset executor + Git-on-SQL wiring + DataFusion OLAP (HTAP)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aruaru-core  = { path = "../aruaru-core" }
parking_lot.workspace = true
serde.workspace      = true
serde_json.workspace = true
rust-json.workspace = true
anyhow.workspace     = true
thiserror.workspace  = true
tracing.workspace    = true
sqlparser.workspace  = true
# ScyllaDB shard-per-core方式のtoken-aware routing簡略版に使うハッシュ
# (aruaru-core::storageのZFS互換チェックサムと同じSHA-256、新規アルゴリズム
# を増やさない意図)
sha2.workspace       = true

# OLAP 実行エンジン (HTAP の OLAP 側)
datafusion.workspace = true
arrow.workspace      = true
tokio.workspace       = true

[dev-dependencies]
tokio.workspace = true
