[package]
name        = "aruaru-query"
description = "aruaru-DB query engine: SQL subset executor + Git-on-SQL wiring + DataFusion OLAP (HTAP)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aruaru-core  = { path = "../aruaru-core" }
parking_lot.workspace = true
serde.workspace      = true
serde_json.workspace = true
rust-json.workspace = true
anyhow.workspace     = true
thiserror.workspace  = true
tracing.workspace    = true
sqlparser.workspace  = true
# ScyllaDB本家の実装方法(Murmur3、暗号学的ハッシュではない)を2026-08-21に
# 再調査した結果、sha2依存は不要と判明(shard_forをmurmur3_32自前実装へ
# 差し替え済み、sharded_store.rs参照)。ここに残していたsha2依存は削除した。
# DuckDB風zone map(min/max block pruning)の簡易WHERE句抽出に使う
# (2026-08-21、DuckDB再調査で追加)
regex.workspace       = true

# OLAP 実行エンジン (HTAP の OLAP 側)
datafusion.workspace = true
arrow.workspace      = true
tokio.workspace       = true

[dev-dependencies]
tokio.workspace = true
