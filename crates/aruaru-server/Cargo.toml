[package]
name        = "aruaru-server"
description = "aruaru-DB server binary (pgwire + GraphQL + admin REST)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "aruaru-server"
path = "src/main.rs"

[dependencies]
aruaru-core    = { path = "../aruaru-core" }
aruaru-dist    = { path = "../aruaru-dist" }
aruaru-query   = { path = "../aruaru-query" }
aruaru-wire    = { path = "../aruaru-wire" }
aruaru-graphql = { path = "../aruaru-graphql" }
aruaru-registry = { path = "../aruaru-registry" }
aruaru-backup  = { path = "../aruaru-backup" }
poem.workspace        = true
tokio.workspace       = true
anyhow.workspace      = true
tracing.workspace     = true
tracing-subscriber.workspace = true
clap.workspace        = true
serde.workspace       = true
serde_json.workspace  = true
parking_lot.workspace = true
chrono.workspace      = true
# 【2026-08-29 P1】宣言的設定 `aruaru.yaml` のロード + ホットリロード
# (docs/CONTROL_PLANE_REDESIGN.md)。`serde_yaml` は非推奨のため後継の
# `serde_norway` を使う。ファイル監視は WunderGraph Cosmo の `watch_config`
# と同じ mtime ポーリング方式で自前実装(新規依存を増やさない)。
serde_norway  = "0.9"
# APIキー自動ライフサイクル管理(2026-08-29新設、src/keyring.rs参照)。
# RPoemの`KeyGuardian`と同じ最小依存構成(SHA-256ハッシュ化+UUID発行)。
sha2.workspace        = true
hex.workspace         = true
uuid.workspace        = true
# DUAL DATABASE構成(`DUAL_DATABASE_URL`)向け。aruaru-dist/aruaru-wireと
# 同じsqlx postgres featureセット。
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
# 自動アップデート機能(2026-08-19新設、src/self_update.rs参照)向けの
# GitHub Releases API問い合わせ+アセットダウンロード用HTTPクライアント。
# 他クレート(aruaru-registry等)と同じrustls-tls構成に揃える。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[features]
# スタンドアロンのメール・ディザスタバックアップ(2026-07-25追記)。
# `aruaru-dist`の同名featureをそのまま素通しする。
disaster_email_backup = ["aruaru-dist/disaster_email_backup"]
