[package]
name        = "aruaru-dist"
description = "aruaru-DB distributed layer: openraft consensus + range sharding"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aruaru-core  = { path = "../aruaru-core" }
# ephemeral SQL pod(`ephemeral.rs`)の `EphemeralResponse.result` が
# `aruaru_query::QueryResponse` を、`snapshot_for_tenant` が
# `aruaru_query::QueryEngine` を必要とするため追加(2026-08-31、
# `aruaru-graphql`/`aruaru-server` 両方が本クレート経由でこの型・trait を
# 共有するための移設、`admin_shared.rs`/`keyring.rs` と同じパターン)。
# 循環依存にならないことを確認済み(`aruaru-query`/`aruaru-core`は
# `aruaru-dist`に依存しない)。
aruaru-query = { path = "../aruaru-query" }
openraft      = { workspace = true }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
rust-json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
tracing.workspace = true
uuid.workspace = true
async-trait   = "0.1"
reqwest.workspace = true
futures.workspace = true
sha2.workspace = true
hex.workspace = true
# バイナリRaft RPCトランスポート(2026-08-29新設、raft/binary_transport.rs
# 参照)。ノード間通信をREST/JSONから完全に切り離すための長さ
# プレフィックス付きバイナリフレーム(生TCP)のシリアライズに使用。
bincode.workspace = true
# DUAL DATABASE構成(aruaru-db x PostgreSQL、`open-web-server/CLAUDE.md`
# 拡張要件(4)「DB書き込みの四重化」の②。open-web-server-ledgerの
# postgres_wal.rs(①)と同じ`sqlx`postgres featureを使う。
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono"] }
chrono.workspace = true
# aruaru-db commit x open-raid-z スナップショット連携(`open_raid_z` feature
# 有効時のみ)。別Cargoワークスペースへの path 依存であり、
# `default-features = false` により WinFsp/dxc/Windows SDK は不要
# (CPUフォールバックのみ、FileBackedDeviceによるファイルI/Oで検証可能)。
open_raid_z_core = { path = "../../../open-raid-z/open_runo_zfs_source/open_raid_z_core", default-features = false, optional = true }

[features]
open_raid_z = ["dep:open_raid_z_core"]
# Raft決定的シミュレーションテスト(DST)モジュール(raft/sim.rs)を
# 通常ビルドでも公開する(既定は`cfg(test)`のみでビルドされるため、
# `cargo test`以外からシミュレーションを直接呼びたい場合に有効化する)。
sim-testing = []
# スタンドアロンのメール・ディザスタバックアップ(2026-07-25追記)。
# `open_raid_z`機能(commit x ZFSスナップショット連携)とは別軸——
# こちらはVPS間分散同期・ZFSスナップショット連携のいずれも未設定の
# 状態でも、メールアドレスひとつだけで有効化できる最後の砦。
# `open_raid_z_core`の`offsite_backup`feature(lettre経由のSMTP送信、
# `EmailBackupTarget`)をそのまま再利用する(車輪の再発明をしない)。
disaster_email_backup = ["dep:open_raid_z_core", "open_raid_z_core/offsite_backup"]
