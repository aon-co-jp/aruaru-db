[package]
name        = "aruaru-graphql"
description = "aruaru-DB Versionless GraphQL API layer (Poem + async-graphql)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aruaru-core     = { path = "../aruaru-core" }
aruaru-query    = { path = "../aruaru-query" }
aruaru-registry = { path = "../aruaru-registry" }
aruaru-backup   = { path = "../aruaru-backup" }
aruaru-dist     = { path = "../aruaru-dist" }

poem.workspace             = true
async-graphql.workspace    = true
async-graphql-poem.workspace = true
serde.workspace            = true
serde_json.workspace       = true
anyhow.workspace           = true
tracing.workspace          = true
hex.workspace              = true
chrono.workspace           = true
# クラスタトポロジ共有(2026-08-29新設)。REST(`aruaru-server::admin`)と
# 同一の`Arc<Mutex<ClusterTopology>>`を参照するため、同じMutex実装
# (parking_lot)を使う必要がある。
parking_lot.workspace      = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
uuid.workspace             = true
