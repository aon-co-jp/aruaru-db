[package]
name    = "aruaru-admin"
version = "0.4.0"
edition = "2021"

# ワークスペースルート(F:\runo\aruaru-db\Cargo.toml)のmembersには含まれて
# いない独立パッケージ(Tauriデスクトップアプリ、`crates/`配下のサーバー系
# クレートとは依存関係の性質が異なるため)。空の[workspace]テーブルで
# 明示的に単独パッケージとして扱う(cargoのエラーメッセージが示す2つの
# 選択肢のうち、ワークスペースへの参加ではなくこちらを採用——このcrateは
# `crates/`配下のライブラリを直接参照しない独立GUIアプリのため)。
[workspace]

[dependencies]
tauri               = { version = "2", features = [] }
tauri-plugin-shell  = "2"
tauri-plugin-fs     = "2"
tauri-plugin-dialog = "2"
serde               = { version = "1", features = ["derive"] }
serde_json          = "1"
tokio               = { version = "1", features = ["full"] }
reqwest             = { version = "0.12", features = ["json"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
